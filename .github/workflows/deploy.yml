name: Deploy to Bluehosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate SMTP config
        env:
          SMTP_PWD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "<?php" > smtp-config.php
          echo "define('SMTP_HOST', 'smtp.gmail.com');" >> smtp-config.php
          echo "define('SMTP_USERNAME', 'contacto@proadministra.cl');" >> smtp-config.php
          echo "define('SMTP_PASSWORD', '$SMTP_PWD');" >> smtp-config.php
          echo "define('SMTP_PORT', 465);" >> smtp-config.php
          echo "define('SMTP_SECURE', 'ssl');" >> smtp-config.php
          echo "?>" >> smtp-config.php

      - name: Deploy to Bluehosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            package.json
            package-lock.json
            PLAN-*.md
            README.md
